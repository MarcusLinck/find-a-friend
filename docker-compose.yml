version: '3.8'

services:
  findafriend_pg:
    image: postgres:16-alpine
    container_name: findafriend_pg
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=findafriend
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: